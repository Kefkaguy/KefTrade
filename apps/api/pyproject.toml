[project]
name = "keftrade-api"
version = "0.1.0"
description = "FastAPI backend for KefTrade quantitative research MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "psycopg[binary]>=3.2.0",
  "pandas>=2.2.0",
  "numpy>=2.0.0",
  "yfinance>=0.2.50",
  "pandas-market-calendars>=4.4.0",
  # Tier-1 order-level market data. `databento` supplies the DBN reader and the
  # authoritative Action/Side/flag constants the MBO validator pins itself
  # against; `sortedcontainers` is the price-level structure Databento's own
  # reference book implementation uses.
  "databento>=0.83.0",
  "sortedcontainers>=2.4.0",
  # Stage 1 stores derived order-book state as columnar Parquet; the raw
  # events never enter Postgres.
  "pyarrow>=17.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["no_fingerprint_stub: exercise the real fingerprint check instead of the autouse stub"]
